name: Checks

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-lint:
    runs-on: ubuntu-latest

    # Integration tests (tests/infrastructure) need a real Postgres. The job's `env`
    # context isn't available to services, so the values below must match
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_TEST_DB / POSTGRES_PORT in `env`.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci-test-user
          POSTGRES_PASSWORD: ci-test-password-not-for-production
          POSTGRES_DB: pulsecheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci-test-user -d pulsecheck_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      SMTP_HOST: smtp.example.com
      SMTP_PORT: "587"
      SMTP_USER: ci-test-user
      SMTP_PASSWORD: ci-test-password-not-for-production
      SMTP_FROM: ci-test@example.com
      POSTGRES_USER: ci-test-user
      POSTGRES_PASSWORD: ci-test-password-not-for-production
      POSTGRES_DB: pulsecheck
      POSTGRES_TEST_DB: pulsecheck_test
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check formatting with Black
        run: black --check .

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest
